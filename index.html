
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b14">
<title>CineWave - Filmes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090b14;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #111525;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #8b5cf6;
}

.logo span {
    color: #22d3ee;
}

nav button {
    background: none;
    border: none;
    color: white;
    margin-left: 12px;
    cursor: pointer;
    font-size: 14px;
}

.hero {
    padding: 70px 25px;
    background: linear-gradient(90deg, #090b14, #24134c);
}

.hero h1 {
    font-size: 35px;
    margin-bottom: 15px;
}

.hero p {
    color: #c4c4d0;
    max-width: 500px;
    line-height: 1.5;
}

.search {
    margin: 25px;
    display: flex;
    gap: 10px;
}

.search input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #343950;
    background: #151a2b;
    color: white;
    outline: none;
}

.section {
    padding: 20px 25px;
}

.section h2 {
    margin-bottom: 20px;
}

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 15px;
}

.categories button {
    background: #1b2034;
    color: white;
    border: 1px solid #343950;
    border-radius: 20px;
    padding: 10px 18px;
    white-space: nowrap;
    cursor: pointer;
}

.categories button.active {
    background: #7c3aed;
}

.movies {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 20px;
}

.movie {
    background: #151a2b;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
}

.movie:hover {
    transform: translateY(-5px);
}

.movie img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.movie-info {
    padding: 12px;
}

.movie-info h3 {
    font-size: 15px;
    margin-bottom: 8px;
}

.movie-info p {
    color: #aaa;
    font-size: 13px;
}

.movie-info button {
    margin-top: 10px;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #7c3aed;
    color: white;
    cursor: pointer;
    width: 100%;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.9);
    z-index: 20;
    overflow-y: auto;
    padding: 25px;
}

.modal-content {
    background: #151a2b;
    max-width: 600px;
    margin: 30px auto;
    border-radius: 15px;
    padding: 25px;
}

.modal-content img {
    width: 150px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.modal-content h2 {
    margin-bottom: 12px;
}

.modal-content p {
    color: #ccc;
    line-height: 1.6;
    margin-bottom: 15px;
}

.close {
    float: right;
    font-size: 25px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

.empty {
    color: #aaa;
    padding: 20px 0;
}

@media(max-width: 500px) {
    .hero h1 {
        font-size: 27px;
    }

    .movies {
        grid-template-columns: repeat(2, 1fr);
    }

    .movie img {
        height: 200px;
    }

    nav button {
        margin-left: 5px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Cine<span>Wave</span></div>
    <nav>
        <button onclick="showHome()">Início</button>
        <button onclick="showFavorites()">Favoritos</button>
    </nav>
</header>

<section class="hero">
    <h1>Seu universo de filmes</h1>
    <p>
        Descubra filmes, explore gêneros e encontre
        sua próxima aventura.
    </p>
</section>

<div class="search">
    <input
        type="text"
        id="searchInput"
        placeholder="Pesquisar filmes..."
        oninput="searchMovies()"
    >
</div>

<section class="section">
    <h2>Categorias</h2>
    <div class="categories" id="categories">
        <button class="active" onclick="filterCategory('Todos', this)">Todos</button>
        <button onclick="filterCategory('Ação', this)">Ação</button>
        <button onclick="filterCategory('Aventura', this)">Aventura</button>
        <button onclick="filterCategory('Ficção', this)">Ficção</button>
        <button onclick="filterCategory('Animação', this)">Animação</button>
        <button onclick="filterCategory('Drama', this)">Drama</button>
    </div>
</section>

<section class="section">
    <h2 id="sectionTitle">Filmes populares</h2>
    <div class="movies" id="movieList"></div>
</section>

<div class="modal" id="movieModal" onclick="closeOutside(event)">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <div id="modalInfo"></div>
    </div>
</div>

<footer>
    CineWave © 2026 - Seu cinema digital
</footer>

<script>
const movies = [
    {
        id: 1,
        title: "Vingadores: Ultimato",
        year: 2019,
        genre: "Ação",
        rating: "8.4",
        image: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",
        description: "Após os acontecimentos devastadores de Guerra Infinita, os heróis restantes precisam encontrar uma maneira de reverter os acontecimentos e salvar o universo."
    },
    {
        id: 2,
        title: "Interestelar",
        year: 2014,
        genre: "Ficção",
        rating: "8.7",
        image: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
        description: "Uma equipe de exploradores viaja através de um buraco de minhoca em busca de um novo lar para a humanidade."
    },
    {
        id: 3,
        title: "Homem-Aranha: Sem Volta Para Casa",
        year: 2021,
        genre: "Ação",
        rating: "8.2",
        image: "https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg",
        description: "Peter Parker enfrenta consequências inesperadas depois que sua identidade secreta é revelada."
    },
    {
        id: 4,
        title: "Vingadores: Guerra Infinita",
        year: 2018,
        genre: "Ação",
        rating: "8.4",
        image: "https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg",
        description: "Os Vingadores e seus aliados precisam enfrentar uma ameaça capaz de destruir metade da vida no universo."
    },
    {
        id: 5,
        title: "O Rei Leão",
        year: 2019,
        genre: "Aventura",
        rating: "6.8",
        image: "https://image.tmdb.org/t/p/w500/dzBtMocZuJbjLOXvrl4zGYigDzh.jpg",
        description: "Simba precisa descobrir seu verdadeiro destino e recuperar seu lugar como rei."
    },
    {
        id: 6,
        title: "Divertida Mente 2",
        year: 2024,
        genre: "Animação",
        rating: "7.6",
        image: "https://image.tmdb.org/t/p/w500/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg",
        description: "Novas emoções chegam à mente de Riley durante uma fase de grandes mudanças."
    },
    {
        id: 7,
        title: "Coringa",
        year: 2019,
        genre: "Drama",
        rating: "8.4",
        image: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg",
        description: "Uma história sobre Arthur Fleck e sua transformação em uma das figuras mais conhecidas de Gotham."
    },
    {
        id: 8,
        title: "Duna",
        year: 2021,
        genre: "Ficção",
        rating: "8.0",
        image: "https://image.tmdb.org/t/p/w500/d5NXSklXo0qyIYkgV94XAgMIckC.jpg",
        description: "Paul Atreides viaja até um planeta perigoso para garantir o futuro de sua família e de seu povo."
    }
];

let favorites = JSON.parse(localStorage.getItem("cineFavorites")) || [];
let currentCategory = "Todos";
let favoritesMode = false;

function renderMovies(list) {
    const container = document.getElementById("movieList");
    container.innerHTML = "";

    if (list.length === 0) {
        container.innerHTML = '<p class="empty">Nenhum filme encontrado.</p>';
        return;
    }

    list.forEach(movie => {
        const isFavorite = favorites.includes(movie.id);

        container.innerHTML += `
            <div class="movie">
                <img src="${movie.image}"
                     alt="${movie.title}"
                     onclick="showDetails(${movie.id})"
                     onerror="this.src='https://placehold.co/300x450/151a2b/ffffff?text=Filme'">

                <div class="movie-info">
                    <h3>${movie.title}</h3>
                    <p>${movie.year} • ${movie.genre}</p>
                    <p>⭐ ${movie.rating}</p>
                    <button onclick="toggleFavorite(${movie.id})">
                        ${isFavorite ? "♥ Favoritado" : "♡ Favoritar"}
                    </button>
                </div>
            </div>
        `;
    });
}

function filterCategory(category, button) {
    currentCategory = category;
    favoritesMode = false;

    document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("sectionTitle").innerText =
        category === "Todos" ? "Filmes populares" : category;

    updateMovies();
}

function updateMovies() {
    let result = movies;

    if (favoritesMode) {
        result = result.filter(movie => favorites.includes(movie.id));
    } else if (currentCategory !== "Todos") {
        result = result.filter(movie => movie.genre === currentCategory);
    }

    const search = document.getElementById("searchInput").value.toLowerCase();

    result = result.filter(movie =>
        movie.title.toLowerCase().includes(search)
    );

    renderMovies(result);
}

function searchMovies() {
    updateMovies();
}

function toggleFavorite(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(item => item !== id);
    } else {
        favorites.push(id);
    }

    localStorage.setItem("cineFavorites", JSON.stringify(favorites));
    updateMovies();
}

function showFavorites() {
    favoritesMode = true;
    document.getElementById("sectionTitle").innerText = "Meus favoritos";
    document.getElementById("searchInput").value = "";
    updateMovies();
}

function showHome() {
    favoritesMode = false;
    currentCategory = "Todos";
    document.getElementById("sectionTitle").innerText = "Filmes populares";
    document.getElementById("searchInput").value = "";

    document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

    document.querySelector(".categories button").classList.add("active");

    updateMovies();
}

function showDetails(id) {
    const movie = movies.find(item => item.id === id);

    document.getElementById("modalInfo").innerHTML = `
        <img src="${movie.image}" alt="${movie.title}">
        <h2>${movie.title}</h2>
        <p>${movie.year} • ${movie.genre}</p>
        <p>⭐ Nota: ${movie.rating}</p>
        <p>${movie.description}</p>
        <button onclick="toggleFavorite(${movie.id}); showDetails(${movie.id})"
        style="background:#7c3aed;color:white;border:0;padding:12px;border-radius:8px;cursor:pointer">
            ${favorites.includes(movie.id) ? "Remover dos favoritos" : "Adicionar aos favoritos"}
        </button>
    `;

    document.getElementById("movieModal").style.display = "block";
}

function closeModal() {
    document.getElementById("movieModal").style.display = "none";
}

function closeOutside(event) {
    if (event.target.id === "movieModal") {
        closeModal();
    }
}

renderMovies(movies);
</script>

</body>
</html>
